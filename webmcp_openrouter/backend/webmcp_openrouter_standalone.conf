# ============================================================================
# webmcp_openrouter_standalone.conf — webmcp_openrouter 전용 standalone nginx (8082 포트)
# ============================================================================
# 기존 webmcp(8081) 와 완전히 분리된 standalone nginx 입니다.
# 이 파일을 별도로 두고 nginx -c 로 실행해, 8082 포트에서 webmcp_openrouter만 서빙합니다.
#
# 실행:
#   sudo nginx -c /etc/nginx/webmcp_openrouter_standalone.conf
#   sudo nginx -s reload -c /etc/nginx/webmcp_openrouter_standalone.conf
#   sudo nginx -s stop   -c /etc/nginx/webmcp_openrouter_standalone.conf
#
# 접속:
#   http://<서버IP>:8082/            → 데모 페이지 (프론트)
#   http://<서버IP>:8082/api/chat    → LLM 프록시 (백엔드 8002)
# ============================================================================

# 독립 실행이라 기본 nginx(80) 및 webmcp(8081) 와 분리된 pid/로그를 사용
pid /run/nginx-webmcp-openrouter.pid;
error_log /var/log/nginx/webmcp_openrouter_error.log;
worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/webmcp_openrouter_access.log;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen       8082;
        listen       [::]:8082;
        server_name  _;

        # 공용 프론트 (데모/위젯)
        root /usr/share/nginx/webmcp_openrouter;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 백엔드 FastAPI 프록시 (LLM 키는 백엔드 DB에서 관리)
        location /api/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # 백엔드 헬스체크 (연결 상태 배지용)
        location = /health {
            proxy_pass http://127.0.0.1:8002/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # /api/chat CORS 사전 요청(OPTIONS) 허용
        location = /api/chat {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 3600 always;
                return 204;
            }
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
